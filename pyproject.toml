[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "carpool-agents"
version = "0.2.0"
description = "Many agent tasks, one ride. Batch independent LLM tasks into one verified request — same answers, a fraction of the tokens."
readme = "docs/PYPI.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["llm", "agents", "tokens", "cost", "claude", "codex", "batching", "prompt-compression"]

[project.urls]
Homepage = "https://github.com/nmayp/carpool"
Source = "https://github.com/nmayp/carpool"
Results = "https://github.com/nmayp/carpool/blob/main/docs/RESULTS.md"
Issues = "https://github.com/nmayp/carpool/issues"
Changelog = "https://github.com/nmayp/carpool/blob/main/CHANGELOG.md"

[project.optional-dependencies]
anthropic = ["anthropic"]
dev = ["pytest"]

[project.scripts]
carpool = "carpool.cli:main"
carpool-mcp = "carpool.mcp_server:main"

[tool.setuptools]
packages = ["carpool"]

[tool.setuptools.package-data]
carpool = ["data/*.jsonl"]
