name: Bug or wrong accepted answer
description: Something broke, or carpool accepted an answer it should have redone
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Command, tasks file (or the task's question, sources and IDs) and the model's reply if relevant.
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: carpool version, Python version, backend
